<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">ExpressionEngine logo: the syntax tree of x + 1</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- tree edges -->
  <g stroke="#fff" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.9">
    <line x1="112" y1="98" x2="86" y2="146"/>
    <line x1="144" y1="98" x2="170" y2="146"/>
  </g>
  <!-- root: + -->
  <circle cx="128" cy="72" r="34" fill="#fff"/>
  <g stroke="#4F46E5" stroke-width="9" stroke-linecap="round">
    <line x1="113" y1="72" x2="143" y2="72"/>
    <line x1="128" y1="57" x2="128" y2="87"/>
  </g>
  <!-- left leaf: x -->
  <circle cx="72" cy="176" r="30" fill="#fff"/>
  <g stroke="#4F46E5" stroke-width="9" stroke-linecap="round">
    <line x1="61" y1="165" x2="83" y2="187"/>
    <line x1="83" y1="165" x2="61" y2="187"/>
  </g>
  <!-- right leaf: 1 -->
  <circle cx="184" cy="176" r="30" fill="#fff"/>
  <g stroke="#4F46E5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="174,170 187,160 187,192"/>
  </g>
</svg>
